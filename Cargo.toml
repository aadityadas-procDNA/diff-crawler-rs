[package]
name = "diff-crawler"
version = "0.1.0"
edition = "2021"

[lib]
name = "diff_crawler"
path = "src/lib.rs"

[[bin]]
name = "diff-crawler"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# Directory walking
ignore = "0.4"

# Parallelism (Phase 2+)
rayon = "1"

# Hashing (Phase 2+)
sha2 = "0.10"

# Code diff (Phase 2+)
similar = { version = "2", features = ["unicode"] }

# JSON output
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Data diff — lightweight pure-Rust alternatives (no cmake / C++ compilation)
csv = "1"
parquet = "54"

[dev-dependencies]
tempfile = "3"
