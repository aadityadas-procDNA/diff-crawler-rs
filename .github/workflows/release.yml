# Release — triggered when a version tag (v1.2.3) is pushed.
#
# This workflow does two things in parallel:
#
#   build-binaries  — compiles a native binary for each target OS/arch on its
#                     own runner, packs it as a .tar.gz, and attaches it to the
#                     GitHub Release.  Matrix legs run in parallel.
#
#   build-docker    — builds a multi-arch Docker image (linux/amd64 +
#                     linux/arm64) on a single ubuntu-latest runner using QEMU
#                     for arm64 emulation, then pushes to ghcr.io with version
#                     tags derived from the git tag.
#
# How to cut a release:
#   git tag v1.0.0 -m "Release v1.0.0"
#   git push origin v1.0.0
#
# The tag push triggers this workflow.  When it completes, the GitHub Release
# page will have:
#   - diff-crawler-linux-x86_64.tar.gz
#   - diff-crawler-macos-arm64.tar.gz
#   - diff-crawler-macos-x86_64.tar.gz
# And ghcr.io will have:
#   - ghcr.io/<owner>/diff-crawler:1.0.0
#   - ghcr.io/<owner>/diff-crawler:1.0
#   - ghcr.io/<owner>/diff-crawler:latest

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

# ── Job 1: native binaries ────────────────────────────────────────────────────
jobs:
  build-binaries:
    name: Binary · ${{ matrix.asset_name }}
    permissions:
      contents: write   # needed to create/update the GitHub Release and upload assets

    strategy:
      fail-fast: false  # build all targets even if one fails
      matrix:
        include:
          # ── Linux x86_64 ────────────────────────────────────────────────
          # Compiled on ubuntu-latest (Ubuntu 22.04, glibc 2.35).
          # The resulting binary requires glibc >= 2.35 on the host.
          # We use the default gnu target rather than musl because several
          # transitive deps (zstd-sys, lz4-sys) can struggle with musl
          # cross-compilation in CI.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: diff-crawler-linux-x86_64
            binary: diff-crawler

          # ── macOS arm64 (Apple Silicon) ──────────────────────────────────
          # Compiled on the macos-14 runner which is a native M1 machine.
          # Produces a real aarch64-apple-darwin binary, not an emulated one.
          - os: macos-14
            target: aarch64-apple-darwin
            asset_name: diff-crawler-macos-arm64
            binary: diff-crawler

          # ── macOS x86_64 (Intel) ──────────────────────────────────────────
          # Compiled on macos-13 (the last Intel macOS runner).
          # macOS 14 moved to arm64 exclusively.
          - os: macos-13
            target: x86_64-apple-darwin
            asset_name: diff-crawler-macos-x86_64
            binary: diff-crawler

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Install the specific compilation target for this matrix leg.
      - name: Install Rust stable + target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Per-target cache key so different targets don't share stale artifacts.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      # ── Compile ────────────────────────────────────────────────────────────
      - name: cargo build --release
        run: cargo build --release --target ${{ matrix.target }}

      # ── Strip + pack ───────────────────────────────────────────────────────
      # strip  — removes DWARF debug info; reduces size ~3–4x (e.g. 22 MB → 6 MB)
      # tar.gz — conventional format for CLI tools on Linux/macOS; users extract
      #          and copy the binary to /usr/local/bin/
      - name: Strip and package
        shell: bash
        run: |
          BINARY="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          strip "$BINARY" || true          # macOS strip is different but harmless
          tar czf "${{ matrix.asset_name }}.tar.gz" -C "$(dirname "$BINARY")" "${{ matrix.binary }}"

      # ── Upload to GitHub Release ───────────────────────────────────────────
      # softprops/action-gh-release creates the Release if it doesn't exist yet
      # (using the tag name as the release title and auto-generated notes from
      # merged PRs) and attaches the archive as a release asset.  Multiple
      # parallel jobs can all call this action safely — it handles race conditions.
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Job 2: multi-arch Docker image ─────────────────────────────────────────
  build-docker:
    name: Docker · linux/amd64 + linux/arm64
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # needed to push to ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── QEMU ───────────────────────────────────────────────────────────────
      # Registers QEMU binary format handlers so the kernel can transparently
      # execute arm64 binaries during the Docker build.  This is what allows
      # `docker buildx build --platform linux/arm64` to work on an x86_64 host.
      # The arm64 build runs inside a QEMU-emulated environment; it's slower
      # than native (roughly 4–6×) but avoids needing a separate arm64 runner.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # ── Docker Buildx ──────────────────────────────────────────────────────
      # Buildx is Docker's extended CLI plugin built on BuildKit.  It adds
      # multi-platform build support, BuildKit-native caching, and the
      # `--push` flag that pushes images directly from the build context
      # without a separate `docker push` step.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Registry login ─────────────────────────────────────────────────────
      # Authenticates with the GitHub Container Registry using the Actions
      # bot token.  GITHUB_TOKEN is automatically available; no extra secret
      # needs to be configured.  The actor (pusher) must have write access to
      # the repository's packages — granted by `permissions: packages: write`.
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Image metadata ─────────────────────────────────────────────────────
      # Generates Docker tags and OCI labels from the git tag.
      #
      # For a push of tag v1.2.3, this produces:
      #   tags:
      #     ghcr.io/<owner>/diff-crawler:1.2.3   (exact version)
      #     ghcr.io/<owner>/diff-crawler:1.2      (minor track)
      #     ghcr.io/<owner>/diff-crawler:latest   (always latest)
      #   labels:
      #     org.opencontainers.image.source  = https://github.com/<owner>/<repo>
      #     org.opencontainers.image.version = 1.2.3
      #     org.opencontainers.image.revision = <commit SHA>
      #     … (other OCI standard labels)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # ── Build and push ─────────────────────────────────────────────────────
      # Builds for linux/amd64 and linux/arm64 in a single build invocation.
      # Each platform's build runs inside its respective emulation environment.
      # The result is a multi-arch manifest list pushed to ghcr.io: when users
      # run `docker pull ghcr.io/<owner>/diff-crawler:latest`, Docker
      # automatically selects the right binary for their machine architecture.
      #
      # cache-from/cache-to: type=gha stores BuildKit layer cache in the
      # GitHub Actions cache.  On subsequent releases (when only src/ changes),
      # the dependency compilation layer is restored from cache, cutting the
      # multi-arch build time from ~20 min to ~6 min.
      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
